services:

  # ============================================
  # PostgreSQL Databases
  # ============================================
  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - microservices-net

  # ============================================
  # RabbitMQ Broker
  # ============================================
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: rabbitmq-broker

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - microservices-net

  # ============================================
  # Eureka Discovery Server
  # ============================================
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile

    container_name: discovery-server

    env_file:
      - ./discovery-server/.env.prod

    ports:
      - "8761:8761"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    env_file:
      - ./api-gateway/.env.prod

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # Iam Service
  # ============================================
  iam-service:
    build:
      context: ./authentication
      dockerfile: Dockerfile

    container_name: iam-service

    env_file:
      - ./authentication/.env.prod

    ports:
      - "8081:8081"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # Profiles Service
  # ============================================
  profiles-service:
    build:
      context: ./users
      dockerfile: Dockerfile

    container_name: profiles-service

    env_file:
      - ./users/.env.prod

    ports:
      - "8082:8082"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # Sales Service
  # ============================================
  sales-service:
    build:
      context: ./sales
      dockerfile: Dockerfile

    container_name: sales-service

    env_file:
      - ./sales/.env.prod

    ports:
      - "8083:8083"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # Media Service
  # ============================================
  media-service:
    build:
      context: ./media
      dockerfile: Dockerfile

    container_name: media-service

    env_file:
      - ./media/.env.prod

    ports:
      - "8084:8084"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

    depends_on:
      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # Notification Service
  # ============================================
  notification-service:
    build:
      context: ./notifications
      dockerfile: Dockerfile

    container_name: notification-service

    env_file:
      - ./notifications/.env.prod

    ports:
      - "8085:8085"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    depends_on:
      rabbitmq:
        condition: service_healthy

      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

  # ============================================
  # AI Service
  # ============================================
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile

    container_name: ai-service

    env_file:
      - ./ai/.env.prod

    ports:
      - "8086:8086"

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      discovery-server:
        condition: service_healthy

    networks:
      - microservices-net

# =========================================
# NETWORKS
# =========================================
networks:
  microservices-net:
    driver: bridge
    name: microservices-net

# =========================================
# VOLUMES
# =========================================
volumes:
  postgres_data:
    name: postgres_data
  rabbitmq_data:
    name: rabbitmq_data